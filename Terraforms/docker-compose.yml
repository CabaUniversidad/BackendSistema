# Fragmento clave de Terraforms/docker-compose.yml

version: '3.8'
services:
  # -------------------- FRONTEND --------------------
  frontend:
    # 🛑 ESTA LÍNEA ES CRÍTICA: Debe apuntar a la imagen que subiste.
    image: tu_usuario_docker/front_web:latest 
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
  # -------------------- BACKEND --------------------
  backend:
    # 🛑 ESTA LÍNEA ES CRÍTICA: Debe apuntar a la imagen que subiste.
    image: tu_usuario_docker/backend_api:latest
    container_name: backend
    restart: always
    environment:
      # Ejemplo de variable que el backend podría necesitar
      - FRONTEND_URL=http://<IP_PUBLICA_VM> 
    ports:
      - "8000:8000"
      - "80:80"