version: '3.8'

services:
  # -------------------- FRONTEND (Flet Web) --------------------
  frontend:
    # 🎯 CAMBIO CRÍTICO 1: Usar la variable de Shell facc1.
    # Esta variable será definida y exportada en el script de despliegue.
    image: facc1/front_web:latest 
    container_name: frontend
    restart: always
    # 🎯 CAMBIO CRÍTICO 2: Mapear el puerto público 80 al puerto interno 8550
    # que tu Dockerfile de Frontend está exponiendo.
    ports:
      - "80:8550"
    depends_on:
      - backend

  # -------------------- BACKEND (FastAPI) --------------------
  backend:
    # 🎯 CAMBIO CRÍTICO 1: Usar la variable de Shell facc1.
    image: facc1/backend_fastapi:latest
    container_name: backend
    restart: always
    environment:
      # 🎯 CONEXIÓN FRONTEND-BACKEND: Usar el nombre del servicio 'backend' para la comunicación interna.
      # Para el backend, la URL del frontend es la IP pública, si la necesita.
      - FRONTEND_URL=http://<IP_PUBLICA_VM> 
    ports:
      - "8000:8000"
      
networks:
  default:
    # Usa la red por defecto creada por Docker Compose para que los servicios se vean entre sí.